<!doctype html>
<!--
  proto-builder 种子模板 — 移动-平板 App 模拟

  平台：平板 App 模拟（iPad 壳 768×1024）
  Chrome：侧边栏 (260px) + 主面板（TopBar + Content）
  布局范式：分栏主从视图 + 触屏交互
  引入：@import url('../_common.css') — 通用组件样式（运行时位于 prototype/working/_common.css）
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[REPLACE] App Title</title>
  <link rel="stylesheet" href="../design-system.css" />
  <style>
    @import url('../_common.css');

    /* ── Stage (centers tablet on page) ───────────────────────────────── */
    html, body { height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%,
        color-mix(in oklch, var(--color-primary) 4%, var(--color-background)) 0%,
        var(--color-background) 60%);
      display: grid; place-items: center;
      padding: 24px;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .stage-caption {
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-text-secondary, var(--color-text));
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    }

    /* ── Tablet Frame ─────────────────────────────────────────────────── */
    .tablet-frame {
      width: 768px; height: 1024px;
      border-radius: 32px;
      border: 6px solid #2a2a2c;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 24px 48px -8px rgba(0,0,0,0.4);
      background: var(--color-background);
      position: relative;
    }

    /* ── App Shell ────────────────────────────────────────────────────── */
    .app-shell {
      width: 100%; height: 100%;
      display: flex;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────── */
    .sidebar {
      width: 260px; min-width: 260px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 20px 20px 12px;
      font-family: var(--font-heading, inherit);
      font-size: 20px; font-weight: 700;
      letter-spacing: -0.01em;
    }
    .sidebar-search {
      padding: 0 16px 12px;
    }
    .sidebar-item, .sidebar-subitem {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      font-size: 15px; font-weight: 500;
      color: var(--color-text-secondary, var(--color-text));
      cursor: pointer; transition: background 0.1s ease;
    }
    .sidebar-item:hover, .sidebar-subitem:hover {
      background: color-mix(in oklch, var(--color-text) 5%, transparent);
    }
    .sidebar-item.active {
      background: color-mix(in oklch, var(--color-primary) 10%, transparent);
      color: var(--color-primary);
    }
    .sidebar-subitem { padding-left: 48px; font-size: 14px; }
    .sidebar-section-label {
      padding: 16px 20px 6px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-text-secondary, var(--color-text));
    }
    .sidebar-item .sidenav-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .sidebar-item .sidenav-badge { margin-left: auto; }

    /* ── Main Panel ───────────────────────────────────────────────────── */
    .main-panel {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }

    /* ── Top Bar ──────────────────────────────────────────────────────── */
    .top-bar {
      height: 48px; min-height: 48px;
      display: flex; align-items: center;
      padding: 0 24px; gap: 16px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    .top-bar-title {
      font-size: 17px; font-weight: 600;
      letter-spacing: -0.01em;
    }
    .top-bar-actions {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
    }
    .top-bar-btn {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: var(--radius-md, 6px);
      background: none; border: 0; cursor: pointer;
      color: var(--color-text-secondary, var(--color-text));
    }
    .top-bar-btn:hover { background: color-mix(in oklch, var(--color-text) 6%, transparent); }

    /* ── Content Area ─────────────────────────────────────────────────── */
    .content {
      flex: 1; overflow-y: auto;
      padding: 24px;
    }

    /* ── Split View (master-detail) ───────────────────────────────────── */
    .split-view {
      display: flex; flex: 1; overflow: hidden;
    }
    .split-master {
      width: 320px; min-width: 320px;
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
    }
    .split-detail {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .split-detail-placeholder {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--color-text-secondary, var(--color-text));
      padding: 32px;
    }

    /* ── Popover ──────────────────────────────────────────────────────── */
    .popover {
      position: absolute; z-index: 50;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg, 8px);
      box-shadow: var(--shadow-lg, 0 4px 16px rgba(0,0,0,0.12));
      padding: 4px 0; min-width: 180px;
      display: none;
    }
    .popover.show { display: block; }
    .popover-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; font-size: 14px;
      color: var(--color-text); cursor: pointer;
    }
    .popover-item:hover { background: color-mix(in oklch, var(--color-primary) 8%, transparent); }

    /* ── Sheet (slide-up from bottom) ─────────────────────────────────── */
    .sheet-overlay {
      position: absolute; inset: 0; z-index: 80;
      background: rgba(0,0,0,0.25);
      display: none;
    }
    .sheet-overlay.show { display: block; }
    .sheet {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 81;
      max-height: 60%;
      background: var(--color-surface);
      border-radius: 16px 16px 0 0;
      padding: 16px 20px 24px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .input-with-icon .input { padding-left: 34px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="stage">
    <span class="stage-caption">[REPLACE] 平板 App 原型 · <strong>[REPLACE] 屏幕名称</strong></span>

    <div class="tablet-frame">
      <div class="app-shell">
        <!-- ═══ SIDEBAR ═══ -->

            <svg class="icon icon-md sidenav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
  <circle cx="12" cy="12" r="3" /></svg>

          <div class="sidebar-subitem">账户</div>
          <div class="sidebar-subitem">通知</div>
        </aside>

        <!-- ═══ MAIN PANEL ═══ -->
        <div class="main-panel">
          <header class="top-bar" data-pb-id="top-bar">
            <span class="top-bar-title">[REPLACE] 页面标题</span>
            <div class="top-bar-actions">
              <button type="button" class="top-bar-btn" title="搜索"><svg class="icon icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" />
  <circle cx="11" cy="11" r="8" /></svg></button>
              <button type="button" class="top-bar-btn" title="添加"><svg class="icon icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" />
  <path d="M12 5v14" /></svg></button>
              <button type="button" class="btn btn-sm btn-primary">[REPLACE] 新建</button>
            </div>
          </header>

          <main class="content" data-pb-id="content">
            <!-- ═══════════════════════════════════════════════════════════
                 PASTE LAYOUTS FROM references/layouts/mobile-tablet-app-layouts.md HERE.
                 ═══════════════════════════════════════════════════════════ -->
          </main>
        </div>
      </div>

      <!-- ═══ SHEET (hidden) ═══ -->
      <div class="sheet-overlay" id="sheetOverlay" onclick="this.classList.remove('show');document.getElementById('sheet').classList.remove('show')"></div>
      <div class="sheet" id="sheet">
        <div class="sheet-handle"></div>
        <!-- sheet content -->
      </div>
    </div>
  </div>
</body>
</html>
