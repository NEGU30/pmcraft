<!doctype html>
<!--
  proto-builder 种子模板 — PC-桌面软件风格

  平台：PC 桌面软件风格
  Chrome：工具栏 + 多面板 Grid + 状态栏，无浏览器式顶部栏
  布局范式：IDE / 设计工具 / 数据分析桌面端
  引入：@import url('../_common.css') — 通用组件样式（运行时位于 prototype/working/_common.css）
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[REPLACE] App Title</title>
  <link rel="stylesheet" href="../design-system.css" />
  <style>
    @import url('../_common.css');

    /* ── App Layout ───────────────────────────────────────────────────── */
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      font-size: 13px;
    }

    /* ── Toolbar ──────────────────────────────────────────────────────── */
    .toolbar {
      height: 40px; min-height: 40px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center;
      padding: 0 8px; gap: 2px;
      -webkit-user-select: none;
      user-select: none;
    }
    .toolbar-group {
      display: flex; align-items: center; gap: 2px;
      padding: 0 4px;
    }
    .toolbar-group + .toolbar-group {
      border-left: 1px solid var(--color-border);
      margin-left: 2px; padding-left: 6px;
    }
    .toolbar-btn {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: 4px;
      background: none; border: 0;
      color: var(--color-text-secondary, var(--color-text));
      cursor: pointer;
    }
    .toolbar-btn:hover { background: color-mix(in oklch, var(--color-text) 8%, transparent); color: var(--color-text); }
    .toolbar-btn.active { background: color-mix(in oklch, var(--color-primary) 12%, transparent); color: var(--color-primary); }
    .toolbar-btn:disabled { opacity: 0.3; }
    .toolbar-sep {
      width: 1px; height: 16px;
      background: var(--color-border);
      margin: 0 4px;
    }
    .toolbar-label {
      font-size: 12px; font-weight: 600;
      color: var(--color-text);
      padding: 0 8px;
    }

    /* ── Main Grid ────────────────────────────────────────────────────── */
    .main-grid {
      flex: 1; display: grid;
      grid-template-columns: 200px 1fr 280px;
      overflow: hidden;
    }
    .main-grid.two-panel { grid-template-columns: 200px 1fr; }

    /* ── Panels ───────────────────────────────────────────────────────── */
    .panel {
      overflow-y: auto; overflow-x: hidden;
      border-right: 1px solid var(--color-border);
    }
    .panel:last-child { border-right: 0; }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--color-text-secondary, var(--color-text));
      border-bottom: 1px solid var(--color-border);
    }
    .panel-list-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; font-size: 13px;
      color: var(--color-text); cursor: pointer;
      border-left: 2px solid transparent;
    }
    .panel-list-item:hover { background: color-mix(in oklch, var(--color-text) 4%, transparent); }
    .panel-list-item.active {
      background: color-mix(in oklch, var(--color-primary) 8%, transparent);
      border-left-color: var(--color-primary);
      color: var(--color-primary);
    }
    .panel-list-item .item-icon { width: 16px; height: 16px; flex-shrink: 0; color: var(--color-text-secondary, var(--color-text)); }
    .panel-list-item .item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-list-item .item-count {
      font-size: 11px; color: var(--color-text-secondary, var(--color-text));
    }

    /* ── Center Panel (Main Content) ──────────────────────────────────── */
    .center-panel {
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .center-toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .center-content {
      flex: 1; overflow-y: auto;
      padding: 12px;
    }

    /* ── Context Menu ─────────────────────────────────────────────────── */
    .context-menu {
      position: fixed; z-index: 200;
      min-width: 160px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md, 6px);
      box-shadow: var(--shadow-lg, 0 4px 16px rgba(0,0,0,0.12));
      padding: 4px 0;
      display: none;
    }
    .context-menu.show { display: block; }
    .context-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px; font-size: 13px;
      color: var(--color-text); cursor: pointer;
    }
    .context-menu-item:hover { background: color-mix(in oklch, var(--color-primary) 8%, transparent); }
    .context-menu-item .shortcut {
      margin-left: auto; font-size: 11px;
      color: var(--color-text-secondary, var(--color-text));
    }
    .context-menu-divider {
      height: 1px; background: var(--color-border);
      margin: 4px 0;
    }

    /* ── Dense Table (Desktop Tool) ───────────────────────────────────── */
    .dense-table { font-size: 12px; }
    .dense-table td { padding: 4px 8px; }

    /* ── Status Bar ───────────────────────────────────────────────────── */
    .status-bar {
      height: 24px; min-height: 24px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      display: flex; align-items: center;
      padding: 0 12px; gap: 16px;
      font-size: 11px;
      color: var(--color-text-secondary, var(--color-text));
    }
    .status-bar .status-item { display: flex; align-items: center; gap: 4px; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--color-success, #16a34a);
    }
    .status-bar .spacer { flex: 1; }
    .center-toolbar .input { max-width: 280px; padding: 4px 8px; font-size: 12px; }
    .panel-body { padding: 12px; }
  </style>
</head>
<body>
  <!-- ═══ TOOLBAR ═══ -->
  <div class="toolbar" data-pb-id="toolbar">
    <span class="toolbar-label">[REPLACE] 文件</span>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" title="新建"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M9 15h6" />
  <path d="M12 18v-6" /></svg></button>
      <button type="button" class="toolbar-btn" title="打开"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></svg></button>
      <button type="button" class="toolbar-btn" title="保存"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
  <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" />
  <path d="M7 3v4a1 1 0 0 0 1 1h7" /></svg></button>
    </div>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" title="撤销"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6" />
  <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" /></svg></button>
      <button type="button" class="toolbar-btn" title="重做"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7v6h-6" />
  <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7" /></svg></button>
    </div>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" title="搜索"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" />
  <circle cx="11" cy="11" r="8" /></svg></button>
    </div>
    <!-- Spacer for app-specific toolbar actions -->
  </div>

  <!-- ═══ MAIN GRID ═══ -->
  <div class="main-grid" data-pb-id="main-grid">
    <!-- LEFT PANEL: Tree / List -->
    <aside class="panel" data-pb-id="left-panel">
      <div class="panel-header">
        <span>[REPLACE] 面板</span>
        <button type="button" class="toolbar-btn" title="添加"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" />
  <path d="M12 5v14" /></svg></button>
      </div>
      <div class="panel-list-item active">
        <svg class="icon icon-md item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
        <span class="item-label">[REPLACE] 选中项</span>
        <span class="item-count">12</span>
      </div>
      <div class="panel-list-item">
        <svg class="icon icon-md item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
        <span class="item-label">[REPLACE] 项目 A</span>
        <span class="item-count">5</span>
      </div>
      <div class="panel-list-item">
        <svg class="icon icon-md item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
        <span class="item-label">[REPLACE] 项目 B</span>
        <span class="item-count">8</span>
      </div>
    </aside>

    <!-- CENTER: Main Content -->
    <div class="center-panel" data-pb-id="center-panel">
      <div class="center-toolbar">
        <button type="button" class="toolbar-btn" title="发送"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"/></svg></button>
        <input class="input" type="text" placeholder="[REPLACE] 搜索..." aria-label="[REPLACE] 搜索">
      </div>
      <div class="center-content" data-pb-id="center-content">
        <!-- ═══════════════════════════════════════════════════════════
             PASTE LAYOUTS FROM references/layouts/pc-desktop-style-layouts.md HERE.
             ═══════════════════════════════════════════════════════════ -->
      </div>
    </div>

    <!-- RIGHT PANEL: Detail / Properties -->
    <aside class="panel" data-pb-id="right-panel">
      <div class="panel-header">
        <span>[REPLACE] 属性</span>
      </div>
      <div class="panel-body">
        <p class="text-muted text-sm">[REPLACE] 选中项目以查看属性</p>
      </div>
    </aside>
  </div>

  <!-- ═══ STATUS BAR ═══ -->
  <div class="status-bar">
    <span class="status-item"><span class="status-dot"></span> 就绪</span>
    <span class="spacer"></span>
    <span>[REPLACE] 共 N 条</span>
    <span>[REPLACE] 最后更新: --</span>
  </div>

  <!-- ═══ CONTEXT MENU (hidden by default) ═══ -->
  <div class="context-menu" id="ctxMenu" data-pb-id="context-menu">
    <div class="context-menu-item"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> 编辑 <span class="shortcut">Enter</span></div>
    <div class="context-menu-item"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg> 复制 <span class="shortcut">Ctrl+C</span></div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6" />
  <path d="M14 11v6" />
  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
  <path d="M3 6h18" />
  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg> <span class="text-danger">删除</span> <span class="shortcut">Del</span></div>
  </div>

  <script>
    /* context menu handler */
    document.addEventListener('contextmenu', function(e) {
      var cm = document.getElementById('ctxMenu');
      if (!cm) return;
      var row = e.target.closest('tr');
      if (!row) { cm.classList.remove('show'); return; }
      e.preventDefault();
      cm.style.left = e.clientX + 'px';
      cm.style.top  = e.clientY + 'px';
      cm.classList.add('show');
    });
    document.addEventListener('click', function() {
      var cm = document.getElementById('ctxMenu');
      if (cm) cm.classList.remove('show');
    });
  </script>
</body>
</html>
